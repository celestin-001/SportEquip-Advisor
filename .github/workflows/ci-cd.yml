name: CI Laravel Tests & SonarCloud

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-Geeks2025@}"
          MYSQL_DATABASE: sportequipDB
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p${MYSQL_ROOT_PASSWORD} --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sportequipDB
      DB_USERNAME: root
      DB_PASSWORD: Geeks2025@
      COMPOSER_ALLOW_SUPERUSER: 1

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, pdo_mysql, bcmath, xml
          coverage: xdebug

      - name: Install dependencies
        run: |
          cd backend
          composer install --no-interaction --prefer-dist

      - name: Copy .env
        run: |
          cd backend
          cp .env.example .env
          php artisan key:generate

      - name: Clear config
        run: |
          cd backend
          php artisan config:clear

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD} --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL is ready!"

      - name: Run migrations
        run: |
          cd backend
          php artisan migrate --force

      - name: Run tests with coverage
        run: |
          cd backend
          php artisan test \
            --coverage-clover=coverage.xml \
            --log-junit=tests-report.xml

      - name: List generated files (debug)
        run: |
          cd backend
          ls -la coverage.xml tests-report.xml || echo "Files not found"

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend