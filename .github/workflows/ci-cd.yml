name: CI Laravel Tests & SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: sportequipDB
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sportequipDB
      DB_USERNAME: root
      DB_PASSWORD: root_password
      COMPOSER_ALLOW_SUPERUSER: 1

    steps:
      - uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, pdo_mysql, bcmath, xml
          coverage: xdebug

      - name: Install dependencies
        run: |
          cd backend
          composer install --no-interaction --prefer-dist

      - name: Copy .env
        run: |
          cd backend
          cp .env.example .env
          php artisan key:generate

      - name: Clear config
        run: |
          cd backend
          php artisan config:clear

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -uroot -proot_password --silent; do
            sleep 2
          done

      - name: Run migrations
        run: |
          cd backend
          php artisan migrate --force

      - name: Run tests with coverage
        run: |
          cd backend
          php artisan test \
            --coverage-clover=coverage.xml \
            --log-junit=tests-report.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.sources=app
            -Dsonar.tests=tests
            -Dsonar.php.coverage.reportPaths=coverage.xml
            -Dsonar.junit.reportPaths=tests-report.xml
