name: CI Laravel Tests & SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: sportequipDB
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: mysql        # ← ici, pas 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sportequipDB
      DB_USERNAME: root
      DB_PASSWORD: root_password
      COMPOSER_ALLOW_SUPERUSER: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, pdo_mysql, bcmath, xml
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Set permissions for Laravel
        run: chmod -R 775 storage bootstrap/cache

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h mysql -P 3306 --silent; do
            sleep 2
          done

      - name: Run migrations
        run: php artisan migrate --env=testing --force

      - name: Run Tests with Coverage & JUnit
        run: |
          php artisan test \
            --coverage-clover=coverage.xml \
            --log-junit=tests-report.xml

      - name: Upload Test Reports
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: |
            coverage.xml
            tests-report.xml
            coverage-html

      - name: Run SonarQube Scan
        uses: sonarsource/sonarcloud-github-action@master
        with:
          projectKey: ${{ secrets.SONAR_PROJECT_KEY }}
          organization: ${{ secrets.SONAR_ORG }}
          token: ${{ secrets.SONAR_TOKEN }}
          extraProperties: |
            sonar.sources=app
            sonar.tests=tests
            sonar.php.coverage.reportPaths=coverage.xml
            sonar.junit.reportPaths=tests-report.xml
