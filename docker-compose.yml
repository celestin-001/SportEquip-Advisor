services:
  app:
    build: ./backend
    volumes:
      - ./backend:/var/www
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: sportequipDB
      MYSQL_USER: root
      MYSQL_PASSWORD: Geeks2025@
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"

  sonarqube:
    image: 'sonarqube:latest'
    container_name: sonarqube
    restart: always
    ports:
      - '9000:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: