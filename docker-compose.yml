

networks:
  backend-network:
    driver: bridge

volumes:
  db_data:

services:
  app:
    build: ./backend
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
      - ./backend/bootstrap/cache:/var/www/bootstrap/cache
    expose:
      - "9000"
    environment:
      DB_CONNECTION: "mysql"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_DATABASE: "sportequipDB"
      DB_USERNAME: "root"
      DB_PASSWORD: "Geeks2025@"
    depends_on:
      - db
    networks:
      - backend-network

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: "sportequipDB"
      MYSQL_ROOT_PASSWORD: "Geeks2025@"
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - backend-network
