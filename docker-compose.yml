services:
  app:
    build: ./backend
    volumes:
      - ./backend:/var/www
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: sportequipDB
      MYSQL_USER: root
      MYSQL_PASSWORD: Geeks2025@
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3307"
