

services:
  app:
    build: ./backend
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
      - ./backend/bootstrap/cache:/var/www/bootstrap/cache
    expose:
      - "9000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sportequipDB
      DB_USERNAME: laravel
      DB_PASSWORD: Geeks2025@
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: sportequipDB
      MYSQL_USER: laravel
      MYSQL_PASSWORD: Geeks2025@
      MYSQL_ROOT_PASSWORD: root
      # MYSQL_ROOT_PASSWORD: Geeks2025@
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
