networks:
  backend-network:
    driver: bridge

volumes:
  db_data:

services:
  app:
    build: ./backend
    container_name: sportequip_app
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
      - ./backend/bootstrap/cache:/var/www/bootstrap/cache
    expose:
      - "9000"
    environment:
      DB_CONNECTION: "mysql"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_DATABASE: "sportequipDB"
      DB_USERNAME: "root"
      DB_PASSWORD: "${DB_PASSWORD:-Geeks2025@}"
    depends_on:
      - db
    networks:
      - backend-network
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: sportequip_db
    environment:
      MYSQL_DATABASE: "sportequipDB"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-Geeks2025@}"
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend-network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  nginx:
    image: nginx:alpine
    container_name: sportequip_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - backend-network
    restart: unless-stopped